name: progress

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        required: false
        default: ubuntu-latest

jobs:
  decomp-report:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_history.py
      - run: python tools/generate_decomp_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: NSPE_report
          path: build/report.json
          if-no-files-found: error
